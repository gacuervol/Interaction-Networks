[project]
name = "Interaction-Networks"
version = "0.1.0"
description = ""
authors = [
    {name = "gacuervol",email = "gacuervol@unal.edu.co"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy (>=2.2.5,<3.0.0)",
    "jax (>=0.6.0,<0.7.0)",
    "jraph (==0.0.6.*)",
    "dm-haiku (>=0.0.14,<0.0.15)",
    "chex (>=0.1.89,<0.2.0)",
    "trimesh (>=4.6.8,<5.0.0)",
    "xarray (>=2025.4.0,<2026.0.0)"
]

[tool.poetry]
packages = [{include = "InteractionNet", from = "src"}]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
